[paths]
;run table and images, relative to this folder or absolute
run_csv = run.csv
images_dir = images
;certificate CSV (aim_mm, measured_mm, optional U_um); blank = nominal positions, NOT traceable
cert_csv = cert.csv
;optional blank (grating-free) image at the same settings, used to flat-field
flat_field =
output_dir = output

[scale]
;edmund59276_metric | edmund59276_english | sm4  (layouts in scales.py; tick layouts are assumed)
profile = edmund59276_metric
;image direction in which scale readings increase (depends on how the slide was flipped face down)
increases_to = right
;units of aim/measured in the certificate: mm | um | inch
cert_units = mm
cert_temp_c = 20.0
;soda-lime; confirm with the vendor
cte_ppm_per_c = 9.0
cte_u_ppm_per_c = 1.0
;expanded uncertainty (k=2) per certified position, used when the certificate has no U_um column
cert_U_um_k2 = 0.415
;correlation of the end-point errors: 0 = independent, 1 = fully correlated
cert_correlation = 0.0
;layout overrides (blank = profile default), e.g. tick_levels = 4:2,20:3,40:4
division_um =
tick_levels =
tick_style =
line_width_um =
range_mm =
;scale ranges (mm) to keep out of the tick fit, e.g. -0.15:0.15, 3.3:3.5
exclude_mm =

[grating]
;part ID as written on the box; ArgusEye uses the same string
name = MS-460-2-N-A
;what "x" means, written into grating_period.json for ArgusEye
axis_definition = x: the lattice axis along the scale (image rows) with grating_rot_deg = 0; only x is measured for now, and it is taken to be ArgusEye's 8-spot direction by agreement, not checked by KeyMaster
;2d | 1d
type = 2d
;nominal periods along the grating x and y axes (um)
period_x_um = 242.12
period_y_um = 242.12
;odd (even spot count, odd orders only) | all (odd spot count) | auto; used for checks only
orders_x = odd
orders_y = odd
;fused silica
cte_ppm_per_c = 0.55
cte_u_ppm_per_c = 0.05
;largest expected angle between grating lattice and scale (deg); larger angles are flagged
max_angle_deg = 2.0
;the repeat found in each image must match the nominal period (or half of it) within this (%)
period_tolerance_pct = 3
;scale reading (mm) at the grating centre, for the central uniformity check; blank = run middle
centre_mm = 0.0

[imaging]
;starting guess only; measured in every image from the ticks
um_per_px_nominal = 1.04
;auto | dark (chrome darker, transmitted light) | bright
polarity = auto
;x,y of the optical axis in pixels; blank = image centre
optical_centre_px =
;counts treated as saturated; blank = 98% of the file's full scale
saturation_level =

[stage]
;change of scale reading per change of stage_x_mm (+1/-1); used when scale_mm is blank in run.csv
stage_to_scale_sign = 1

[analysis]
reference_temp_c = 20.0
;standard uncertainty of the scale temperature (C)
temp_u_c = 0.3
outlier_sigma = 3.0
;polynomial order of certified position vs pixel within one image
tick_fit_order = 3
;search window around scale_mm for numbering the ticks (mm)
tick_search_mm = 0.3
;auto | on | off: fit the lattice point's offset from the optical centre (height parallax)
parallax_regressor = auto
;half-cell shifts scoring above this fraction of the best match are treated as indistinguishable
ambiguity_threshold = 0.8
central_halfwidth_mm = 1.5
;pass/fail target on U (k=2)
target_ppm = 50
harmonics_max = 10
;parallel processes for image analysis (each needs about 1.5 GB of memory)
workers = 4

[keyence]
;Keyence-calibration mode (--keyence): um/px from each VHX TIFF = entry 17 / tag17_factor
tag17_factor = 2.37319
;set to override the file's calibration (um/px); blank = read it from each TIFF
um_per_px =
;standard uncertainty of the Keyence calibration (ppm, k=1): about 0.5% given the 0.6% change
;at the last recalibration, the 0.18% zoom-to-zoom spread and the plate's unknown accuracy
calibration_u_ppm = 5000
;allowance for lens distortion in a whole-field lattice fit (ppm, k=1)
distortion_u_ppm = 100

[quick]
;single-field mode: uncertainty allowed for height / magnification difference (ppm, k=1)
height_u_ppm = 50
;known magnification difference of the grating plane vs the scale plane (ppm), if scale and
;grating are in one stacked image
parallax_ppm = 0
