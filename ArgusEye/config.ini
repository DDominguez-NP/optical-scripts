[paths]
;image files, relative to this folder or absolute; several files (comma separated) are averaged
reference_images = HOLOOR_RefGrating_MS-460-2-N-A_110226.png
sample_images = HOLOOR_SampleA_MS-500-1-Y-A_110226.png
;dark frames (beam blocked, same exposure/gain); leave blank to estimate the background from the image
reference_darks =
sample_darks =
output_dir = output

[wavelength]
;wavelength the angles are reported at, treated as the wavelength in air
wavelength_nm = 1310.0

[camera]
pixel_pitch_um = 5.0
;nominal Fourier lens focal length; only a starting guess, the reference calibrates it
focal_length_mm = 60.0

[reference]
name = MS-460
;spots along the image x (columns) and y (rows)
nx = 8
ny = 6
;nominal angle between neighbouring spots (orders -1/+1 for an even count)
separation_deg = 0.62
;separation_y_deg =
;measured grating period; when set it overrides separation_deg
period_um =
;period_y_um =
;standard uncertainty of the period, ppm (k=1)
period_uncertainty_ppm =

[sample]
name = MS-500
nx = 6
ny = 4
;angle between neighbouring spots and its tolerance; leave blank to skip pass/fail
spec_separation_deg =
spec_tolerance_deg =

[detection]
;spots must exceed background + threshold_sigma * noise (in the smoothed image)
threshold_sigma = 8
min_area_px = 20
;a spot whose peak reaches this fraction of full scale is treated as saturated
saturation_fraction = 0.98
;degree of the 2D distortion polynomial in the camera calibration (1 = ideal f*tan(theta) lens)
distortion_degree = 3
