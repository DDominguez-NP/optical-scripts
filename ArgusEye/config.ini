[paths]
;image files, relative to this folder or absolute; several files (comma separated, or a wildcard
;pattern with * or ?) are averaged. Naming: <part>_<Ref|Smp>_<yyyymmdd-hhmm>_<nn|dark>.raw
reference_images = Images\MS-460-2-N-A_Ref_20261112-1642_??.raw
sample_images = Images\MS-500-1-Y-A_Smp_20261112-1725_??.raw
;dark frames (beam blocked, same exposure/gain); leave blank to estimate the background from the image
reference_darks = Images\MS-460-2-N-A_Ref_20261112-1642_dark.raw
sample_darks = Images\MS-500-1-Y-A_Smp_20261112-1725_dark.raw
output_dir = output

[wavelength]
;wavelength the angles are reported at, treated as the wavelength in air
wavelength_nm = 1310.0

[camera]
pixel_pitch_um = 5.0
;nominal Fourier lens focal length; only a starting guess, the reference calibrates it
focal_length_mm = 60.0
;.raw files from Arena are bare pixel data: give the image size and the pixel format they were
;saved in (Mono8, Mono10, Mono10p, Mono12, Mono12p, Mono16, Mono24, Mono32), or auto to guess
;from the file size (16-bit data is then assumed to be Mono16). Arena's <file>.raw.json sidecar,
;when present, overrides these three settings
raw_width = 1280
raw_height = 1024
raw_pixel_format = auto

[reference]
name = MS-460
;spots along the image x (columns) and y (rows)
nx = 8
ny = 6
;KeyMaster grating_period.json (relative to this folder or absolute); when set it overrides
;period_um and separation_deg below. Results are flagged interim while the file says traceable = false
period_file = ..\KeyMaster\output\20261112_102336_keyence\grating_period.json
;nominal angle between neighbouring spots (orders -1/+1 for an even count)
separation_deg = 0.62
;separation_y_deg =
;measured grating period; when set it overrides separation_deg
period_um =
;period_y_um =
;standard uncertainty of the period, ppm (k=1)
period_uncertainty_ppm =

[sample]
name = MS-500
nx = 6
ny = 4
;angle between neighbouring spots and its tolerance; leave blank to skip pass/fail
spec_separation_deg =
spec_tolerance_deg =

[detection]
;spots must exceed background + threshold_sigma * noise (in the smoothed image)
threshold_sigma = 8
min_area_px = 20
;a spot whose peak reaches this fraction of full scale is treated as saturated
saturation_fraction = 0.98
;Brown-Conrady lens-distortion terms fitted in the camera calibration: k1, k1 p1 p2, k1 k2 p1 p2, ...
;(radial k1..k3 in order, tangential p1 p2 together). k1 is the default: over the few degrees the
;Fourier lens covers, k2/k3 are poorly determined and extrapolate badly beyond the reference spots.
;The model with p1 p2 toggled is also fitted; its shift sets the distortion-model uncertainty
distortion = k1
